<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>はじめてガイド｜キニナルメーカー</title>
<meta name="description" content="キニナルメーカーの使い方を、会話しながら3分で覚えられるガイドです。">
<meta property="og:title" content="はじめてガイド｜キニナルメーカー">
<meta property="og:description" content="キニナルメーカーの使い方を、会話しながら3分で覚えられるガイドです。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://notti.jp/tutorial">
<meta property="og:image" content="https://notti.jp/tutorial/images/g-01.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://notti.jp/tutorial">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   キニナルメーカー はじめてガイド
   ----------------------------------------------------------
   ■ 文章・画像の差し替えは、下のほうにある
     「ここだけ編集すればOK」の中だけで完結します。
     このCSS部分は基本さわらなくて大丈夫です。
   ========================================================== */

:root{
  /* 色 ---------------------------------------------------- */
  --paper:   #EDEFF2;   /* 背景（うすい紙色）           */
  --ink:     #1C2431;   /* 文字（濃紺）                 */
  --ink-sub: #5A6472;   /* うすい文字                   */
  --bubble:  #FFFFFF;   /* 吹き出しの色                 */
  --indigo:  #2D4A63;   /* 主役の色（藍）ボタンなど     */
  --indigo-d:#1F3648;   /* 藍・押したとき               */
  --gold:    #D9A227;   /* さし色（山吹）進捗バーなど   */
  --line:    #D5DAE1;   /* 罫線                         */

  /* 大きさ ------------------------------------------------ */
  --fs-body: 18px;      /* 本文の文字サイズ             */
  --fs-lead: 20px;      /* 太字・見出しの文字サイズ     */
  --btn-h:   58px;      /* ボタンの高さ                 */
  --maxw:    600px;     /* 画面の最大幅                 */
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:var(--fs-body);
  line-height:1.85;
  -webkit-text-size-adjust:100%;
}

#app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  box-shadow:0 0 40px rgba(28,36,49,.08);
}

/* ===== 上のバー ===== */
header{
  position:sticky; top:0; z-index:30;
  background:var(--indigo);
  color:#fff;
  padding:env(safe-area-inset-top) 0 0 0;
}
.hd-row{ display:flex; align-items:center; gap:10px; padding:12px 14px 10px; }
.hd-back{
  flex:0 0 auto; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12); border:0; border-radius:50%;
  color:#fff; font-size:22px; line-height:1; cursor:pointer;
}
.hd-back:disabled{ opacity:.25; cursor:default; }
.hd-title{
  flex:1 1 auto;
  font-family:"Shippori Mincho B1",serif;
  font-weight:700; font-size:17px; letter-spacing:.04em; line-height:1.3;
}
.hd-title small{
  display:block; font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:400; font-size:12px; opacity:.7; letter-spacing:.08em;
}
.hd-step{ flex:0 0 auto; font-size:13px; letter-spacing:.06em; opacity:.85; font-variant-numeric:tabular-nums; }
.hd-bar{ height:4px; background:rgba(255,255,255,.18); }
.hd-bar>i{ display:block; height:100%; width:0%; background:var(--gold); transition:width .45s ease; }

/* ===== 会話エリア ===== */
main{ flex:1 1 auto; padding:20px 16px 24px; overflow-anchor:none; }

.msg{
  display:flex; gap:10px; margin:0 0 12px;
  opacity:0; transform:translateY(8px);
  animation:pop .38s ease forwards;
}
@keyframes pop{ to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){
  .msg{ animation:none; opacity:1; transform:none; }
  .hd-bar>i{ transition:none; }
}

.av{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  background:var(--indigo); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:"Shippori Mincho B1",serif; font-size:15px; overflow:hidden;
}
.av img{ width:100%; height:100%; object-fit:cover; }
.av.hide{ visibility:hidden; }

.bub{
  background:var(--bubble);
  border-radius:18px;
  padding:13px 16px;
  max-width:calc(100% - 52px);
  box-shadow:0 1px 2px rgba(28,36,49,.07);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.msg.first .bub{ border-radius:4px 18px 18px 18px; }
.bub.lead{ font-size:var(--fs-lead); font-weight:700; letter-spacing:.01em; }
.bub.note{ background:#FBF6E6; border:1px solid #EBDCAE; font-size:16.5px; }

/* 画像 */
.figwrap{ max-width:calc(100% - 52px); flex:1 1 auto; }
.fig{
  position:relative; margin:0;
  border-radius:14px; overflow:hidden;
  background:var(--bubble);
  box-shadow:0 1px 3px rgba(28,36,49,.10);
  border:1px solid var(--line);
}
.fig img{ display:block; width:100%; height:auto; }
.fig figcaption{
  padding:9px 13px; font-size:14.5px; color:var(--ink-sub);
  border-top:1px solid var(--line); line-height:1.6;
}
.ph{
  width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:repeating-linear-gradient(45deg,#E3E7EC 0 12px,#DDE2E8 12px 24px);
  color:#8A94A2;
}
.ph b{ font-family:"Shippori Mincho B1",serif; font-size:30px; color:#6E7986; line-height:1.2; }
.ph span{ font-size:13px; letter-spacing:.06em; }
.idbadge{
  position:absolute; right:8px; bottom:8px;
  background:rgba(28,36,49,.82); color:#fff;
  font-size:12px; letter-spacing:.1em; padding:3px 8px; border-radius:6px;
  display:none;
}
body.shownum .idbadge{ display:block; }

/* ===== 下の選択ボタン ===== */
#choices{
  position:sticky; bottom:0; z-index:20;
  background:linear-gradient(to bottom,rgba(237,239,242,0),var(--paper) 22%);
  padding:18px 16px 14px;
  display:flex; flex-direction:column; gap:10px;
}
.ch{
  min-height:var(--btn-h); width:100%;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--indigo); color:#fff;
  border:0; border-radius:12px; padding:12px 18px;
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-size:17.5px; font-weight:700; line-height:1.5;
  text-align:left; cursor:pointer;
  box-shadow:0 2px 0 var(--indigo-d);
  transition:transform .08s ease;
}
.ch:active{ transform:translateY(2px); box-shadow:0 0 0 var(--indigo-d); }
.ch::after{ content:"›"; font-size:22px; opacity:.65; }
.ch.sub{ background:#fff; color:var(--indigo); border:1.5px solid var(--indigo); box-shadow:0 2px 0 var(--line); font-weight:500; font-size:16.5px; }
.ch.quiet{ background:transparent; color:var(--ink-sub); border:1.5px solid var(--line); box-shadow:none; font-weight:500; font-size:16px; min-height:50px; }
.ch:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }

/* ===== 下の小さなリンク ===== */
#tools{
  padding:4px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; gap:18px;
  font-size:13px; color:var(--ink-sub); background:var(--paper);
}
#tools button{
  background:none; border:0; color:var(--ink-sub);
  font-size:13px; text-decoration:underline; cursor:pointer;
  font-family:inherit; padding:6px;
}

/* ===== 全文表示・FAQ ===== */
.doc{ padding:8px 2px 10px; }
.doc h2{
  font-family:"Shippori Mincho B1",serif;
  font-size:21px; margin:34px 0 14px; padding-bottom:8px;
  border-bottom:2px solid var(--indigo);
}
.doc h2:first-child{ margin-top:6px; }
.doc .qa{ background:#fff; border-radius:12px; padding:16px 18px; margin:0 0 12px; box-shadow:0 1px 2px rgba(28,36,49,.06); }
.doc .qa b{ display:block; margin-bottom:6px; color:var(--indigo); font-size:17px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hd-row">
      <button class="hd-back" id="back" aria-label="まえにもどる">&lsaquo;</button>
      <div class="hd-title">はじめてガイド<small>キニナルメーカー</small></div>
      <div class="hd-step" id="step"></div>
    </div>
    <div class="hd-bar"><i id="bar"></i></div>
  </header>

  <main id="chat"></main>
  <div id="choices"></div>
  <div id="tools">
    <button id="tgnum">画像番号を表示</button>
    <button id="tgtop">さいしょから</button>
  </div>
</div>

<script>
/* ============================================================
   ▼▼▼ ここだけ編集すればOK ▼▼▼
   ============================================================

   ● 画像について
     画像は  tutorial/images/  フォルダに入れてください。
     ファイル名は  g-11.png  のように「g-」＋番号 です。
       11番  → tutorial/images/g-11.png
       18b番 → tutorial/images/g-18b.png
     .png が無ければ .webp .jpg も自動でさがします。
     画像がまだ無いときは、番号入りの灰色の枠が出ます。

   ● 書き方
     { b:"文章" }              … 吹き出し
     { b:"文章", lead:true }   … 大きい太字の吹き出し
     { b:"文章", note:true }   … 黄色い補足の吹き出し
     { img:"11", cap:"説明" }  … 画像（capは省略できます）
     { c:[ {t:"ボタンの文字", go:"とび先のID"} ] } … 選択ボタン

     ボタンの見た目：
       style:"sub"   … 白いボタン
       style:"quiet" … 目立たないボタン
       href:"..."    … 外部リンクにする

     文章のなかで改行したいときは \n と書いてください。

   ============================================================ */

const IMG_DIR = "/tutorial/images/";  /* 画像フォルダの場所（絶対パス） */
const AVATAR  = "";                   /* アイコン画像。例："/tutorial/images/g-avatar.png" */

/* 進み具合の計算と「ぜんぶ一気に読む」に使う順番 */
const FULL_ORDER = [
 "S00","S01",
 "R1-01","R1-02","R1-03","R1-04","R1-04b","R1-05","R1-06","R1-07","R1-08","R1-09","R1-10",
 "R1-11","R1-11b","R1-11c","R1-11d","R1-11e","R1-11f","R1-11g","R1-11h","R1-11i","R1-12",
 "R2-01","R2-02","R2-02b","R2-03","R2-04","R2-05","R2-06",
 "R3-01","R3-02","R3-02b","R3-02c","R3-02d","R3-02e","R3-02f","R3-02g","R3-02h","R3-02i",
 "R3-02j","R3-02k","R3-02m","R3-02n",
 "R3-03","R3-03b","R3-03c","R3-04","R3-05","R3-06","R3-07","R3-08","R3-08b","R3-08c","R3-08d",
 "R3-09","R3-10",
 "R4-01","R4-02"
];

/* ============================================================
   会話のスクリプト
   ============================================================ */
const SCRIPT = {

/* ===== 導入 ===================================== */
"S00":[
  { b:"はじめまして。\nキニナルメーカーです。", lead:true },
  { img:"01", cap:"あなたの言葉を、読まれる形に。" },
  { b:"このガイドは、上から順にタップしていくだけで\n使い方がわかるようになっています。" },
  { b:"3分ほどで終わります。\nどうぞ気楽に読んでみてください。" },
  { c:[
    { t:"はじめる", go:"S01" },
    { t:"ぜんぶ一気に読む", go:"__ALL__", style:"quiet" }
  ]}
],

"S01":[
  { b:"さいしょに、ひとつだけ質問です。" },
  { b:"あなたが今いちばんやりたいことは、\nどちらですか？", lead:true },
  { c:[
    { t:"自分の投稿を、もっと伸ばしたい", go:"R1-01" },
    { t:"有料noteを買ってもらいたい", go:"R2-01", style:"sub" },
    { t:"まだ、よく分からない", go:"S02", style:"quiet" }
  ]}
],

"S02":[
  { b:"だいじょうぶです。" },
  { b:"このツールは、大きく2つのことができます。" },
  { img:"02", cap:"ぜんたいの流れ" },
  { b:"まずは「投稿を伸ばす」から見てみましょう。" },
  { b:"noteの話は、あとからかならず出てきます。" },
  { c:[{ t:"わかりました", go:"R1-01" }]}
],

/* ===== ルート① わたしの投稿を、強くする ========= */
"R1-01":[
  { b:"ではさっそく。" },
  { b:"いま、Threadsに投稿しようとしている\n文章はありますか？", lead:true },
  { c:[
    { t:"ある", go:"R1-03" },
    { t:"まだ書いていない", go:"R1-02", style:"sub" }
  ]}
],

"R1-02":[
  { b:"書けていなくて、大丈夫です。" },
  { b:"うまい文章を書く必要はありません。" },
  { b:"たとえば、こんなメモでもじゅうぶんです。" },
  { b:"「今日はうまくいかなかった。\nでも一つだけ気づいたことがある」", note:true },
  { b:"このツールは、ゼロから作るものではありません。" },
  { b:"あなたの中にすでにある言葉を\n「読まれる形」に組みなおす道具です。" },
  { c:[{ t:"なるほど", go:"R1-03" }]}
],

"R1-03":[
  { b:"画面のうえに、3つのボタンが並んでいます。" },
  { b:"いちばん左を押してください。" },
  { img:"11", cap:"ここに、あなたの文章を貼り付けます" },
  { b:"箇条書きでも、話し言葉でも、かまいません。" },
  { c:[{ t:"貼りました", go:"R1-04" }]}
],

"R1-04":[
  { b:"つぎに、4つの四角い絵が出てきます。" },
  { img:"12", cap:"どんな形の投稿にするかを選びます" },
  { b:"迷ったときは、左上を選んでください。" },
  { b:"いちばんよく使う、ふつうの形です。" },
  { c:[
    { t:"選んだ", go:"R1-05" },
    { t:"4つのちがいを知りたい", go:"R1-04b", style:"sub" }
  ]}
],

"R1-04b":[
  { b:"かんたんに説明しますね。" },
  { b:"ひとつの投稿で完結させるか、\n続きをコメント欄に分けるか。" },
  { b:"この2つの組み合わせだと思ってください。" },
  { b:"長い話をしたいときは、\n続きを分ける形が向いています。" },
  { b:"途中で「続きはコメント欄へ」としたほうが、\n読んでいる人が最後まで追いかけてくれるからです。" },
  { c:[{ t:"わかりました", go:"R1-05" }]}
],

"R1-05":[
  { b:"あとは、このボタンを押すだけです。" },
  { img:"13", cap:"押すと、AIが考えはじめます" },
  { img:"14", cap:"順番に進んでいきます" },
  { b:"少しだけ待ってください。" },
  { b:"文章を作ったあと、もういちど自分で読み直して、\n直すところがないかをチェックしています。" },
  { c:[{ t:"できました", go:"R1-06" }]}
],

"R1-06":[
  { b:"でました。", lead:true },
  { img:"15", cap:"上に点数、下に新しい文章が出ています" },
  { b:"まずは、点数の読み方からいきましょう。" },
  { c:[{ t:"はい", go:"R1-07" }]}
],

"R1-07":[
  { b:"点数は5つあります。" },
  { img:"16", cap:"5つの観点で採点されます" },
  { b:"① フック力\n1行目で、指が止まるかどうか。", lead:true },
  { b:"タイムラインは、ものすごい速さで流れていきます。" },
  { b:"最初の一行で止まらなければ、中身は読まれません。" },
  { b:"いちばん大事な点数です。" },
  { c:[{ t:"つぎへ", go:"R1-08" }]}
],

"R1-08":[
  { b:"② 共感度\n「これ、自分のことだ」と思ってもらえるか。", lead:true },
  { b:"③ 構成力\n読みはじめてから最後まで、\n途中で離れずに読めるか。", lead:true },
  { b:"④ 拡散性\n人に見せたくなるか、保存したくなるか。", lead:true },
  { b:"⑤ 文化適合\nThreadsという場所になじむ\n書き方になっているか。", lead:true },
  { c:[{ t:"つぎへ", go:"R1-09" }]}
],

"R1-09":[
  { b:"ここで、ひとつだけお伝えしたいことがあります。" },
  { b:"点数が低くても、落ち込まないでください。" },
  { b:"あなたの話に価値がないのではありません。" },
  { b:"ただ「立ち止まってもらう工夫」が\n足りていないだけです。" },
  { b:"そこは、ここから直せます。", note:true },
  { c:[{ t:"つぎへ", go:"R1-10" }]}
],

"R1-10":[
  { b:"点数の下に、こんな文章が出ています。" },
  { img:"17", cap:"どこが弱いのか、なぜそう思ったのかが書かれています" },
  { b:"ここは、読むだけで大丈夫です。" },
  { b:"直した文章は、すぐ下に出ています。" },
  { c:[{ t:"つぎへ", go:"R1-11" }]}
],

/* --- ずるい一言 --- */
"R1-11":[
  { b:"ここで、もう一段だけ強くする方法があります。" },
  { img:"18", cap:"「ずるい一言」のスイッチ" },
  { b:"このスイッチを入れてみてください。" },
  { b:"「ずるい一言」といいます。", lead:true },
  { c:[{ t:"押してみた", go:"R1-11b" }]}
],

"R1-11b":[
  { b:"押すと、1行目だけが3つ出てきます。" },
  { img:"18b", cap:"出だしの一行が、3案ならびます" },
  { b:"本文はそのままで、出だしだけを変える機能です。" },
  { b:"なぜ1行目だけ、わざわざ別にしているのか。" },
  { b:"理由があります。" },
  { c:[{ t:"聞きたい", go:"R1-11c" }]}
],

"R1-11c":[
  { b:"人がタイムラインを見るとき、\n親指はほとんど止まりません。" },
  { b:"シュッ、シュッと流していきます。" },
  { b:"そのあいだ、目に入っているのは\nほぼ1行目だけです。" },
  { b:"つまり、投稿の中身がどれだけ良くても、\n1行目で止まらなければ\n存在しないのと同じです。", note:true },
  { b:"だから、ここだけを切り離して考えます。" },
  { c:[{ t:"つぎへ", go:"R1-11d" }]}
],

"R1-11d":[
  { b:"3つの案は、それぞれちがう狙いで作られています。" },
  { b:"ひとつめ｜ひっくり返す", lead:true },
  { b:"「がんばるのを、やめました」", note:true },
  { b:"ふつうと逆のことを言うと、\n人は「え？」と手を止めます。" },
  { c:[{ t:"つぎへ", go:"R1-11e" }]}
],

"R1-11e":[
  { b:"ふたつめ｜数字を置く", lead:true },
  { b:"「3週間で、やっと分かった」", note:true },
  { b:"数字があると、話がぐっと具体的になります。" },
  { b:"ぼんやりした話は流されますが、\n具体的な話は確かめたくなります。" },
  { c:[{ t:"つぎへ", go:"R1-11f" }]}
],

"R1-11f":[
  { b:"みっつめ｜気持ちを出す", lead:true },
  { b:"「正直、ちょっと悔しかった」", note:true },
  { b:"うれしい、悔しい、こわい。" },
  { b:"気持ちが入った言葉は、読む人の心が動きます。" },
  { b:"心が動くと、指が止まります。" },
  { c:[{ t:"つぎへ", go:"R1-11g" }]}
],

"R1-11g":[
  { b:"3つのうち、どれを選ぶか。" },
  { b:"迷ったときの決め方をお伝えします。" },
  { b:"声に出して読んでみて、\n自分でも「え？」と思ったもの。" },
  { b:"それを選んでください。" },
  { b:"自分が引っかからない言葉は、\n人も引っかかりません。", note:true },
  { c:[{ t:"つぎへ", go:"R1-11h" }]}
],

/* --- 画像を作る（無いときは番号入りの枠） --- */
function makeFigure(id, cap){
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = '<div class="av hide"></div>';

  const box = document.createElement("div");
  box.className = "figwrap";

  const fig = document.createElement("figure");
  fig.className = "fig";
  fig.style.margin = "0";

  const img = document.createElement("img");
  img.alt = cap || ("画像 " + id);
  img.loading = "lazy";
  let i = 0;
  img.onerror = function(){
    i++;
    if (i < EXTS.length){ img.src = IMG_DIR + "g-" + id + "." + EXTS[i]; return; }
    /* ぜんぶ無ければ、灰色の枠にする */
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.style.aspectRatio = "4 / 3";
    ph.innerHTML = "<b>" + id + "</b><span>画像を入れてください</span><span>images/g-" + id + ".png</span>";
    img.replaceWith(ph);
  };
  img.src = IMG_DIR + "g-" + id + "." + EXTS[0];
  fig.appendChild(img);

  if (cap){
    const fc = document.createElement("figcaption");
    fc.textContent = cap;
    fig.appendChild(fc);
  }
  const badge = document.createElement("span");
  badge.className = "idbadge";
  badge.textContent = "IMG-" + id;
  fig.appendChild(badge);

  box.appendChild(fig);
  wrap.appendChild(box);
  return wrap;
}

/* --- 吹き出しを作る --- */
function makeBubble(item, isFirst){
  const wrap = document.createElement("div");
  wrap.className = "msg" + (isFirst ? " first" : "");
  const av = document.createElement("div");
  av.className = "av" + (isFirst ? "" : " hide");
  if (isFirst){
    if (AVATAR){ av.innerHTML = '<img src="'+AVATAR+'" alt="">'; }
    else { av.textContent = "キ"; }
  }
  const b = document.createElement("div");
  b.className = "bub" + (item.lead ? " lead" : "") + (item.note ? " note" : "");
  b.textContent = item.b;
  wrap.appendChild(av);
  wrap.appendChild(b);
  return wrap;
}

/* --- 進み具合 --- */
let lastProgress = 0;
function updateProgress(id){
  const i = FULL_ORDER.indexOf(id);
  if (i >= 0) lastProgress = i + 1;
  const total = FULL_ORDER.length;
  $step.textContent = lastProgress + " / " + total;
  $bar.style.width = Math.round(lastProgress / total * 100) + "%";
}

/* --- 1ブロックを表示 --- */
let revealTimers = [];
function clearTimers(){ revealTimers.forEach(clearTimeout); revealTimers = []; }

function show(id, push){
  if (id === "__ALL__") return showAll();
  if (id === "__FAQ__") return showFaq();
  const block = SCRIPT[id];
  if (!block){ console.warn("ブロックが見つかりません: " + id); return; }

  if (push && current) hist.push(current);
  current = id;
  $ch.dataset.done = "";
  store.set("kn_guide_pos", id);
  clearTimers();
  $chat.innerHTML = "";
  $ch.innerHTML = "";
  updateProgress(id);
  $back.disabled = hist.length === 0;
  window.scrollTo(0, 0);

  const nodes = [];
  let firstUsed = false;
  let choices = null;

  block.forEach(function(item){
    if (item.c){ choices = item.c; return; }
    if (item.img){ nodes.push(makeFigure(item.img, item.cap)); firstUsed = true; return; }
    const isFirst = !firstUsed;
    nodes.push(makeBubble(item, isFirst));
    firstUsed = true;
  });

  /* 順番に出す */
  let delay = 0;
  nodes.forEach(function(n, idx){
    n.style.display = "none";
    $chat.appendChild(n);
    revealTimers.push(setTimeout(function(){
      n.style.display = "flex";
      if (idx > 0) n.scrollIntoView({behavior:"smooth", block:"nearest"});
      if (idx === nodes.length - 1) paintChoices(choices);
    }, delay));
    delay += 380;
  });

  /* 画面をタップすると、残りを一気に出す */
  $chat.onclick = function(){
    clearTimers();
    nodes.forEach(function(n){ n.style.display = "flex"; });
    paintChoices(choices);
  };
}

function paintChoices(choices){
  if (!choices || $ch.dataset.done === current) return;
  $ch.dataset.done = current;
  $ch.innerHTML = "";
  choices.forEach(function(c){
    const btn = document.createElement("button");
    btn.className = "ch" + (c.style ? " " + c.style : "");
    btn.textContent = c.t;
    btn.onclick = function(){
      if (c.href){ window.location.href = c.href; return; }
      show(c.go, true);
    };
    $ch.appendChild(btn);
  });
}

/* --- ぜんぶ一気に読む --- */
function showAll(){
  if (current) hist.push(current);
  clearTimers();
  $chat.onclick = null;
  $chat.innerHTML = "";
  $ch.innerHTML = "";
  $back.disabled = false;
  window.scrollTo(0,0);

  const doc = document.createElement("div");
  doc.className = "doc";
  const h = document.createElement("h2");
  h.textContent = "ぜんぶまとめて読む";
  doc.appendChild(h);
  $chat.appendChild(doc);

  FULL_ORDER.forEach(function(id){
    const block = SCRIPT[id];
    if (!block) return;
    let first = true;
    block.forEach(function(item){
      if (item.c) return;
      if (item.img){ $chat.appendChild(makeFigure(item.img, item.cap)); first = false; return; }
      const n = makeBubble(item, first);
      n.style.display = "flex";
      $chat.appendChild(n);
      first = false;
    });
  });

  const back = document.createElement("button");
  back.className = "ch";
  back.textContent = "会話ですすむ形にもどる";
  back.onclick = function(){ hist.pop(); show("S00", false); };
  $ch.appendChild(back);
}

/* --- よくある質問 --- */
function showFaq(){
  if (current) hist.push(current);
  clearTimers();
  $chat.onclick = null;
  $chat.innerHTML = "";
  $ch.innerHTML = "";
  $back.disabled = false;
  window.scrollTo(0,0);

  const doc = document.createElement("div");
  doc.className = "doc";
  let html = "<h2>よくある質問</h2>";
  FAQ.forEach(function(qa){
    html += '<div class="qa"><b>Q. ' + qa[0] + "</b>" + qa[1] + "</div>";
  });
  doc.innerHTML = html;
  $chat.appendChild(doc);

  const back = document.createElement("button");
  back.className = "ch";
  back.textContent = "もどる";
  back.onclick = function(){ const p = hist.pop(); show(p || "S00", false); };
  $ch.appendChild(back);
}

/* --- 下のボタン --- */
$back.onclick = function(){
  const p = hist.pop();
  if (p){ show(p, false); }
};
document.getElementById("tgnum").onclick = function(){
  document.body.classList.toggle("shownum");
  this.textContent = document.body.classList.contains("shownum") ? "画像番号を隠す" : "画像番号を表示";
};
document.getElementById("tgtop").onclick = function(){
  hist.length = 0; lastProgress = 0;
  show("S00", false);
};

/* --- 開始（途中まで見ていたら続きから） --- */
(function start(){
  const saved = store.get("kn_guide_pos");
  if (saved && SCRIPT[saved] && saved !== "S00"){
    show("S00", false);
    setTimeout(function(){
      if (current !== "S00") return;
      const bar = document.createElement("button");
      bar.className = "ch sub";
      bar.textContent = "前回のつづきから読む";
      bar.onclick = function(){ show(saved, true); };
      $ch.appendChild(bar);
    }, 1600);
  } else {
    show("S00", false);
  }
})();

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<title>はじめてガイド｜キニナルメーカー</title>

<meta property="og:description" content="キニナルメーカーの使い方を、会話しながら覚えられるガイドです。">

<meta property="og:url" content="https://notti.jp/tutorial">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   キニナルメーカー はじめてガイド
   ----------------------------------------------------------
   ■ 文章・画像の差し替えは、下のほうにある
     「ここだけ編集すればOK」の中だけで完結します。
     このCSS部分は基本さわらなくて大丈夫です。
   ========================================================== */

:root{
  /* 色 ---------------------------------------------------- */
  --paper:   #EDEFF2;   /* 背景（うすい紙色）           */
  --ink:     #1C2431;   /* 文字（濃紺）                 */
  --ink-sub: #5A6472;   /* うすい文字                   */
  --bubble:  #FFFFFF;   /* 吹き出しの色                 */
  --indigo:  #2D4A63;   /* 主役の色（藍）ボタンなど     */
  --indigo-d:#1F3648;   /* 藍・押したとき               */
  --gold:    #D9A227;   /* さし色（山吹）進捗バーなど   */
  --line:    #D5DAE1;   /* 罫線                         */

  /* 大きさ ------------------------------------------------ */
  --fs-body: 18px;      /* 本文の文字サイズ             */
  --fs-lead: 20px;      /* 太字・見出しの文字サイズ     */
  --btn-h:   58px;      /* ボタンの高さ                 */
  --maxw:    600px;     /* 画面の最大幅                 */
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:var(--fs-body);
  line-height:1.85;
  -webkit-text-size-adjust:100%;
}

#app{
  max-width:var(--maxw);
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  box-shadow:0 0 40px rgba(28,36,49,.08);
}

/* ===== 上のバー ===== */
header{
  position:sticky; top:0; z-index:30;
  background:var(--indigo);
  color:#fff;
  padding:env(safe-area-inset-top) 0 0 0;
}
.hd-row{ display:flex; align-items:center; gap:10px; padding:12px 14px 10px; }
.hd-back{
  flex:0 0 auto; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.12); border:0; border-radius:50%;
  color:#fff; font-size:22px; line-height:1; cursor:pointer;
}
.hd-back:disabled{ opacity:.25; cursor:default; }
.hd-title{
  flex:1 1 auto; min-width:0;
  font-family:"Zen Old Mincho",serif;
  font-weight:700; font-size:17px; letter-spacing:.04em; line-height:1.3;
}
.hd-title small{
  display:block; font-family:"Zen Kaku Gothic New",sans-serif;
  font-weight:400; font-size:11.5px; opacity:.7; letter-spacing:.06em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.hd-step{ flex:0 0 auto; font-size:13px; letter-spacing:.06em; opacity:.85; font-variant-numeric:tabular-nums; }
.hd-close{
  flex:0 0 auto; display:flex; align-items:center; gap:5px;
  background:rgba(255,255,255,.16); border:0; border-radius:999px;
  color:#fff; font-family:"Zen Kaku Gothic New",sans-serif;
  font-size:13px; font-weight:700; line-height:1;
  padding:9px 14px; cursor:pointer;
}
.hd-close:active{ background:rgba(255,255,255,.28); }
.hd-close .x{ font-size:15px; line-height:1; }
.hd-close:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.hd-bar{ height:4px; background:rgba(255,255,255,.18); }
.hd-bar>i{ display:block; height:100%; width:0%; background:var(--gold); transition:width .45s ease; }

/* ===== 会話エリア ===== */
main{ flex:1 1 auto; padding:20px 16px 24px; overflow-anchor:none; }

.blk{ display:block; }
/* 章の切れ目 */
.chapmark{
  display:flex; align-items:center; gap:10px;
  margin:22px 0 16px; color:var(--ink-sub);
  font-family:"Zen Old Mincho",serif; font-size:13.5px; letter-spacing:.1em;
}
.chapmark::before,.chapmark::after{ content:""; flex:1 1 auto; height:1px; background:var(--line); }

.msg{
  display:flex; gap:10px; margin:0 0 12px;
  opacity:0; transform:translateY(8px);
  animation:pop .38s ease forwards;
}
@keyframes pop{ to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce){
  .msg{ animation:none; opacity:1; transform:none; }
  .hd-bar>i{ transition:none; }
}

.av{
  flex:0 0 auto; width:38px; height:38px; border-radius:50%;
  background:var(--indigo); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-family:"Zen Old Mincho",serif; font-size:15px; overflow:hidden;
}
.av img{ width:78%; height:78%; object-fit:contain; }
.av.hide{ visibility:hidden; }

.bub{
  background:var(--bubble);
  border-radius:18px;
  padding:13px 16px;
  max-width:calc(100% - 52px);
  box-shadow:0 1px 2px rgba(28,36,49,.07);
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.msg.first .bub{ border-radius:4px 18px 18px 18px; }
.bub.lead{ font-size:var(--fs-lead); font-weight:700; letter-spacing:.01em; }
.bub.note{ background:#FBF6E6; border:1px solid #EBDCAE; font-size:16.5px; }

/* 自分が選んだ答え（右側） */
.msg.me{ justify-content:flex-end; }
.msg.me .bub{
  background:var(--indigo); color:#fff;
  border-radius:18px 4px 18px 18px;
  max-width:82%; box-shadow:0 1px 2px rgba(28,36,49,.14);
  font-size:16.5px; font-weight:500;
}

/* 画像 */
.figwrap{ max-width:calc(100% - 52px); flex:1 1 auto; }
.fig{
  position:relative; margin:0;
  border-radius:14px; overflow:hidden;
  background:var(--bubble);
  box-shadow:0 1px 3px rgba(28,36,49,.10);
  border:1px solid var(--line);
}
.fig img{ display:block; width:100%; height:auto; object-fit:contain; background:var(--bubble); }
.fig figcaption{
  padding:9px 13px; font-size:14.5px; color:var(--ink-sub);
  border-top:1px solid var(--line); line-height:1.6;
}
.ph{
  width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background:repeating-linear-gradient(45deg,#E3E7EC 0 12px,#DDE2E8 12px 24px);
  color:#8A94A2;
}
.ph b{ font-family:"Zen Old Mincho",serif; font-size:30px; color:#6E7986; line-height:1.2; }
.ph span{ font-size:13px; letter-spacing:.06em; }
.idbadge{
  position:absolute; right:8px; bottom:8px;
  background:rgba(28,36,49,.82); color:#fff;
  font-size:12px; letter-spacing:.1em; padding:3px 8px; border-radius:6px;
  display:none;
}
body.shownum .idbadge{ display:block; }

/* ===== 下の選択ボタン ===== */
#choices{
  position:sticky; bottom:0; z-index:20;
  background:linear-gradient(to bottom,rgba(237,239,242,0),var(--paper) 22%);
  padding:18px 16px 14px;
  display:flex; flex-direction:column; gap:10px;
}
.ch{
  min-height:var(--btn-h); width:100%;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--indigo); color:#fff;
  border:0; border-radius:12px; padding:12px 18px;
  font-family:"Zen Kaku Gothic New",sans-serif;
  font-size:17.5px; font-weight:700; line-height:1.5;
  text-align:left; cursor:pointer; text-decoration:none;
  box-shadow:0 2px 0 var(--indigo-d);
  transition:transform .08s ease;
}
.ch:active{ transform:translateY(2px); box-shadow:0 0 0 var(--indigo-d); }
.ch::after{ content:"›"; font-size:22px; opacity:.65; }
.ch.sub{ background:#fff; color:var(--indigo); border:1.5px solid var(--indigo); box-shadow:0 2px 0 var(--line); font-weight:500; font-size:16.5px; }
.ch.quiet{ background:transparent; color:var(--ink-sub); border:1.5px solid var(--line); box-shadow:none; font-weight:500; font-size:16px; min-height:50px; }
.ch.link::after{ content:"↗"; font-size:17px; }
.ch:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }

/* 「タップで一気に出せます」のヒント */
.hint{
  text-align:center; font-size:13px; color:var(--ink-sub);
  letter-spacing:.04em; padding:16px 0; line-height:1.5;
}

/* ===== 下の小さなリンク ===== */
#tools{
  padding:4px 16px calc(20px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; flex-wrap:wrap; gap:6px 18px;
  font-size:13px; color:var(--ink-sub); background:var(--paper);
}
#tools button{
  background:none; border:0; color:var(--ink-sub);
  font-size:13px; text-decoration:underline; cursor:pointer;
  font-family:inherit; padding:6px;
}

/* ===== 全文表示・FAQ ===== */
.doc{ padding:8px 2px 10px; }
.doc h2{
  font-family:"Zen Old Mincho",serif;
  font-size:21px; margin:34px 0 14px; padding-bottom:8px;
  border-bottom:2px solid var(--indigo);
}
.doc h2:first-child{ margin-top:6px; }
.doc .qa{ background:#fff; border-radius:12px; padding:16px 18px; margin:0 0 12px; box-shadow:0 1px 2px rgba(28,36,49,.06); }
.doc .qa b{ display:block; margin-bottom:6px; color:var(--indigo); font-size:17px; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="hd-row">
      <button class="hd-back" id="back" aria-label="まえにもどる">&lsaquo;</button>
      <div class="hd-title"><span id="chap">はじめに</span><small>はじめてガイド｜キニナルメーカー</small></div>
      <div class="hd-step" id="step"></div>
      <button class="hd-close" id="close" aria-label="ガイドを閉じてキニナルメーカーに戻る"><span class="x">&times;</span>とじる</button>
    </div>
    <div class="hd-bar" id="barwrap" role="progressbar" aria-label="この章の進み具合" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="bar"></i></div>
  </header>

  <main id="chat">
    <div id="thread" aria-live="polite"></div>
    <div id="doc" hidden></div>
  </main>
  <div id="choices"></div>
  <div id="tools">
    <button id="tgfaq">よくある質問</button>
    <button id="tgnum">画像番号を表示</button>
    <button id="tgtop">さいしょから</button>
  </div>
</div>

<script>
/* ============================================================
   ▼▼▼ ここだけ編集すればOK ▼▼▼
   ============================================================

   ● 画像について
     画像は  tutorial/images/  フォルダに入れてください。
     ファイル名は  g-11.png  のように「g-」＋番号 です。
       11番  → tutorial/images/g-11.png
       18b番 → tutorial/images/g-18b.png
     画像がまだ無いときは、番号入りの灰色の枠が出ます。

   ● 書き方
     { b:"文章" }              … 吹き出し
     { b:"文章", lead:true }   … 大きい太字の吹き出し
     { b:"文章", note:true }   … 黄色い補足の吹き出し
     { img:"11", cap:"説明" }  … 画像（capは省略できます）
     { c:[ {t:"ボタンの文字", go:"とび先のID"} ] } … 選択ボタン

     画像の縦横比：
       ar:"4/3"   … 標準（省略するとこれ）    1080×810
       ar:"1/1"   … 操作箇所のアップ          1080×1080
       ar:"16/9"  … 横長の説明図              1080×608
       ar:"40/21" … 冒頭・OGP兼用             1200×630
       ※ここを正しく書いておくと、画像を入れたときに
         レイアウトがガクッと動きません。

     ボタンの見た目：
       style:"sub"      … 白いボタン
       style:"quiet"    … 目立たないボタン
       href:"..."       … 外部リンク（別タブで開きます）
       hideIfSeen:"ID"  … そのIDをもう読んでいたら、このボタンは出さない

     文章のなかで改行したいときは \n と書いてください。

   ============================================================ */

/* 画像フォルダ。
   /tutorial/index.html でも /tutorial でも、パソコンで直接
   開いたときでも動くように、開いているURLから組み立てています。 */
const IMG_DIR = (function(){
  const p = location.pathname;
  if (/\/$/.test(p))          return p + "images/";                  /* /tutorial/        */
  if (/\.html?$/i.test(p))    return p.replace(/[^/]*$/, "") + "images/"; /* …/index.html */
  return p + "/images/";                                             /* /tutorial         */
})();

const IMG_EXTS = ["png"];   /* webpで書き出す場合は ["webp","png"] にしてください */
const AVATAR   = IMG_DIR + "g-avatar.png";   /* 空 "" にすると「キ」の文字になります */

/* タブのアイコンも、同じ考え方で貼り直しておきます */
document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]')
  .forEach(function(el){ el.href = IMG_DIR + "g-icon.png"; });

/* ============================================================
   章立て
   進み具合の表示と「ぜんぶ一気に読む」は、ここから作られます。
   ブロックを足したら、この一覧にも足してください。
   ============================================================ */
const CHAPTERS = [
 { name:"はじめに", ids:[
   "S00","S01","S02"
 ]},
 { name:"① 投稿を強くする", ids:[
   "R1-01","R1-02","R1-03","R1-04","R1-04b","R1-05","R1-06","R1-07","R1-08","R1-09","R1-10",
   "R1-11","R1-11b","R1-11c","R1-11d","R1-11e","R1-11f","R1-11g","R1-11h","R1-11i","R1-12"
 ]},
 { name:"② noteを読ませる", ids:[
   "R2-01","R2-02","R2-02b","R2-03","R2-04","R2-05","R2-06"
 ]},
 { name:"共通の機能", ids:[
   "R3-01","R3-02","R3-02b","R3-02c","R3-02d","R3-02e","R3-02f","R3-02g","R3-02h","R3-02i",
   "R3-02j","R3-02k","R3-02m","R3-02n",
   "R3-03","R3-03b","R3-03c","R3-04","R3-05","R3-06","R3-07","R3-08","R3-08b","R3-08c","R3-08d",
   "R3-09","R3-10"
 ]},
 { name:"料金とおわり", ids:[
   "R4-01","R4-02"
 ]}
];

/* ============================================================
   会話のスクリプト
   ============================================================ */
const SCRIPT = {

/* ===== 導入 ===================================== */
"S00":[
  { b:"はじめまして。\nキニナルメーカーです。", lead:true },
  { img:"01", cap:"あなたの言葉を、読まれる形に。" },
  { b:"このガイドは、上から順にタップしていくだけで\n使い方がわかるようになっています。" },
  { b:"ひとつめの使い方だけなら、3分ほど、\nぜんぶ読むと、7分から8分かかります。" },
  { b:"どうぞ気楽に読んでみてください。" },
  { c:[
    { t:"はじめる", go:"S01" },
    { t:"ぜんぶ一気に読む", go:"__ALL__", style:"quiet" }
  ]}
],

"S01":[
  { b:"さいしょに、ひとつだけ質問です。" },
  { b:"あなたが今いちばんやりたいことは、\nどちらですか？", lead:true },
  { c:[
    { t:"自分の投稿を、もっと伸ばしたい", go:"R1-01" },
    { t:"有料noteを買ってもらいたい", go:"R2-01", style:"sub" },
    { t:"まだ、よく分からない", go:"S02", style:"quiet" }
  ]}
],

"S02":[
  { b:"だいじょうぶです。" },
  { b:"このツールは、大きく2つのことができます。" },
  { img:"02", cap:"ぜんたいの流れ" },
  { b:"まずは「投稿を伸ばす」から見てみましょう。" },
  { b:"noteの話は、あとからかならず出てきます。" },
  { c:[{ t:"わかりました", go:"R1-01" }]}
],

/* ===== ルート① わたしの投稿を、強くする ========= */
"R1-01":[
  { b:"ではさっそく。" },
  { b:"いま、Threadsに投稿しようとしている\n文章はありますか？", lead:true },
  { c:[
    { t:"ある", go:"R1-03" },
    { t:"まだ書いていない", go:"R1-02", style:"sub" }
  ]}
],

"R1-02":[
  { b:"書けていなくて、大丈夫です。" },
  { b:"うまい文章を書く必要はありません。" },
  { b:"たとえば、こんなメモでもじゅうぶんです。" },
  { b:"「今日はうまくいかなかった。\nでも一つだけ気づいたことがある」", note:true },
  { b:"このツールは、ゼロから作るものではありません。" },
  { b:"あなたの中にすでにある言葉を\n「読まれる形」に組みなおす道具です。" },
  { c:[{ t:"なるほど", go:"R1-03" }]}
],

"R1-03":[
  { b:"画面のうえに、4つのタブが並んでいます。" },
  { b:"左から\n\n・バズスコア採点\n・note魅力抽出\n・ゴースト投稿\n・フィードバック\n\nの4つです。ぜんぶ、このガイドに出てきます。", note:true },
  { b:"まずは、いちばん左。\n「バズスコア採点」を押してください。", lead:true },
  { img:"11", cap:"ここに、あなたの文章を貼り付けます" },
  { b:"あなたが発信したい内容を入力してください。\n話し言葉でも、かまいません。" },
  { c:[{ t:"貼りました", go:"R1-04" }]}
],

"R1-04":[
  { b:"すぐ下に「投稿の形式」という欄があって、\n四角いカードが4つ、2×2で並んでいます。" },
  { img:"12", cap:"どんな形の投稿にするかを選びます" },
  { b:"迷ったときは、左上の\n「本投稿のみ／しっかり8行」を選んでください。", lead:true },
  { b:"いちばんよく使う、ふつうの形です。" },
  { c:[
    { t:"選んだ", go:"R1-05" },
    { t:"4つのちがいを知りたい", go:"R1-04b", style:"sub" }
  ]}
],

"R1-04b":[
  { b:"かんたんに説明しますね。" },
  { b:"上の2つが「本投稿のみ」。\n下の2つが「本投稿＋リプ」です。", lead:true },
  { b:"・本投稿のみ／しっかり8行\n・本投稿のみ／サクッと5行\n・本投稿＋リプ／リプ10行\n・本投稿＋リプ／元の長さに合わせる" },
  { b:"ひとつの投稿で完結させるか、\n続きをコメント欄（リプ）に分けるか。" },
  { b:"この2つの組み合わせだと思ってください。" },
  { b:"長い話をしたいときは、\n続きを分ける形が向いています。" },
  { b:"途中で「続きはコメント欄へ」としたほうが、\n読んでいる人が最後まで追いかけてくれるからです。" },
  { c:[{ t:"わかりました", go:"R1-05" }]}
],

"R1-05":[
  { b:"あとは、オレンジ色の\n「採点する」ボタンを押すだけです。" },
  { img:"13", cap:"押すと、AIが考えはじめます" },
  { img:"14", cap:"順番に進んでいきます" },
  { b:"少しだけ待ってください。" },
  { b:"文章を作ったあと、もういちど自分で読み直して、\n直すところがないかをチェックしています。" },
  { c:[{ t:"できました", go:"R1-06" }]}
],

"R1-06":[
  { b:"でました。", lead:true },
  { img:"15", cap:"上に点数、下に新しい文章が出ています" },
  { b:"まずは、点数の読み方からいきましょう。" },
  { c:[{ t:"はい", go:"R1-07" }]}
],

"R1-07":[

/* ============================================================
   ▲▲▲ 編集はここまで ▲▲▲
   ここから下は、動かすためのしくみです。
   ============================================================ */

const $thread = document.getElementById("thread");
const $doc    = document.getElementById("doc");
const $ch     = document.getElementById("choices");
const $chap   = document.getElementById("chap");
const $step   = document.getElementById("step");
const $bar    = document.getElementById("bar");
const $barwrap= document.getElementById("barwrap");
const $back   = document.getElementById("back");

const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion:reduce)").matches;

/* 画面に出ているブロックのID（上から順）。
   hideIfSeen は「いま画面に出ているか」で判断します。
   もどって消えたぶんは、読まなかったことになります。 */
const stack = [];
const seen  = { has(id){ return stack.indexOf(id) >= 0; } };
/* いま開いている別画面（"all" / "faq" / null） */
let docOpen = null;
/* ヒントを出す回数 */
let hintLeft = 3;

/* --- 保存（使えない環境では何もしない） --- */
const store = {
  get(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
};
function saveProgress(){
  /* 最初の画面にいるだけでは上書きしません。
     開いて閉じただけで、前回の続きが消えてしまうので。 */
  if (stack.length <= 1) return;
  store.set("kn_guide_stack", JSON.stringify(stack));
}

/* --- 章をさがす --- */
function chapterOf(id){
  for (let i = 0; i < CHAPTERS.length; i++){
    const n = CHAPTERS[i].ids.indexOf(id);
    if (n >= 0) return { ch:CHAPTERS[i], index:i, pos:n + 1, total:CHAPTERS[i].ids.length };
  }
  return null;
}

/* --- 進み具合 --- */
function updateProgress(id){
  const c = chapterOf(id);
  if (!c) return;
  $chap.textContent = c.ch.name;
  $step.textContent = c.pos + " / " + c.total;
  const pct = Math.round(c.pos / c.total * 100);
  $bar.style.width = pct + "%";
  $barwrap.setAttribute("aria-valuenow", String(pct));
  $barwrap.setAttribute("aria-valuetext", c.ch.name + " " + c.pos + "／" + c.total);
}

/* --- 画像を作る（無いときは番号入りの枠） --- */
function makeFigure(id, cap, ar){
  const ratio = ar || "4 / 5";
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = '<div class="av hide"></div>';

  const box = document.createElement("div");
  box.className = "figwrap";

  const fig = document.createElement("figure");
  fig.className = "fig";
  fig.style.margin = "0";

  const img = document.createElement("img");
  img.alt = cap || ("画像 " + id);
  img.loading = "lazy";
  img.decoding = "async";
  img.style.aspectRatio = ratio;   /* 先に場所を取っておく＝入れ替えても飛ばない */
  let i = 0;
  img.onerror = function(){
    i++;
    if (i < IMG_EXTS.length){ img.src = IMG_DIR + "g-" + id + "." + IMG_EXTS[i]; return; }
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.style.aspectRatio = ratio;
    ph.innerHTML = "<b>" + id + "</b><span>画像を入れてください</span><span>images/g-" + id + "." + IMG_EXTS[0] + "</span>";
    img.replaceWith(ph);
  };
  img.src = IMG_DIR + "g-" + id + "." + IMG_EXTS[0];
  fig.appendChild(img);

  if (cap){
    const fc = document.createElement("figcaption");
    fc.textContent = cap;
    fig.appendChild(fc);
  }
  const badge = document.createElement("span");
  badge.className = "idbadge";
  badge.textContent = "IMG-" + id;
  fig.appendChild(badge);

  box.appendChild(fig);
  wrap.appendChild(box);
  return wrap;
}

/* --- 吹き出しを作る --- */
function makeBubble(item, isFirst){
  const wrap = document.createElement("div");
  wrap.className = "msg" + (isFirst ? " first" : "");
  const av = document.createElement("div");
  av.className = "av" + (isFirst ? "" : " hide");
  if (isFirst){
    if (AVATAR){ av.innerHTML = '<img src="' + AVATAR + '" alt="">'; }
    else { av.textContent = "キ"; }
  }
  const b = document.createElement("div");
  b.className = "bub" + (item.lead ? " lead" : "") + (item.note ? " note" : "");
  b.textContent = item.b;
  wrap.appendChild(av);
  wrap.appendChild(b);
  return wrap;
}

/* --- 自分が選んだ答え（右側の吹き出し） --- */
function makeEcho(text){
  const wrap = document.createElement("div");
  wrap.className = "msg me";
  const b = document.createElement("div");
  b.className = "bub";
  b.textContent = text;
  wrap.appendChild(b);
  return wrap;
}

/* --- いちばん下までスクロール --- */
function toBottom(smooth){
  const y = document.documentElement.scrollHeight;
  if (smooth && !REDUCED){ window.scrollTo({ top:y, behavior:"smooth" }); }
  else { window.scrollTo(0, y); }
}

/* ============================================================
   ブロックを1つ、下に足す
   ============================================================ */
let timers = [];
let pending = null;   /* 表示待ちの { nodes, choices } */

function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

function renderBlock(id, opts){
  opts = opts || {};
  const block = SCRIPT[id];
  if (!block){ console.warn("ブロックが見つかりません: " + id); return; }

  clearTimers();
  pending = null;

  const sec = document.createElement("section");
  sec.className = "blk";
  sec.dataset.id = id;

  /* 章が変わったら、区切り線を入れる */
  const c = chapterOf(id);
  const prev = stack.length ? chapterOf(stack[stack.length - 1]) : null;
  if (c && (!prev || prev.index !== c.index) && stack.length){
    const mk = document.createElement("div");
    mk.className = "chapmark";
    mk.textContent = c.ch.name;
    sec.appendChild(mk);
  }

  /* 直前に選んだボタンの文字を、自分の発言として置く */
  if (opts.echo) sec.appendChild(makeEcho(opts.echo));

  const nodes = [];
  let firstUsed = false;
  let choices = null;

  block.forEach(function(item){
    if (item.c){ choices = item.c; return; }
    if (item.img){ nodes.push(makeFigure(item.img, item.cap, item.ar)); firstUsed = true; return; }
    nodes.push(makeBubble(item, !firstUsed));
    firstUsed = true;
  });

  $thread.appendChild(sec);
  stack.push(id);
  updateProgress(id);
  saveProgress();
  $back.disabled = stack.length <= 1;

  sec._choices = choices;

  if (opts.instant){
    nodes.forEach(function(n){ n.style.animation = "none"; n.style.opacity = "1"; sec.appendChild(n); });
    paintChoices(choices);
    return;
  }

  /* 順番に出す */
  pending = { sec:sec, nodes:nodes, choices:choices, shown:0 };
  let delay = 0;
  nodes.forEach(function(n, idx){
    n.style.display = "none";
    sec.appendChild(n);
    timers.push(setTimeout(function(){
      n.style.display = "flex";
      pending.shown = idx + 1;
      toBottom(true);
      if (idx === nodes.length - 1){ pending = null; paintChoices(choices); }
    }, delay));
    delay += 380;
  });

  if (nodes.length > 1 && hintLeft > 0){
    hintLeft--;
    $ch.innerHTML = '<div class="hint">タップすると、続きが一気に出ます</div>';
  } else {
    $ch.innerHTML = "";
  }
  toBottom(true);
}

/* --- 残りを一気に出す --- */
function skipReveal(){
  if (!pending) return;
  clearTimers();
  const p = pending;
  pending = null;
  p.nodes.forEach(function(n){ n.style.display = "flex"; });
  paintChoices(p.choices);
  toBottom(false);
}

/* 文字を選ぼうとしたときや、ボタンを押したときは反応しない */
$thread.addEventListener("click", function(e){
  if (e.target.closest("a,button")) return;
  const sel = window.getSelection && window.getSelection();
  if (sel && !sel.isCollapsed) return;
  skipReveal();
});

/* --- 選択ボタンを描く --- */
let resumeBtn = null;   /* 「前回のつづきから読む」。S00 のときだけ足します */

function paintChoices(choices){
  $ch.innerHTML = "";
  if (!choices) return;
  choices.forEach(function(c){
    if (c.hideIfSeen && seen.has(c.hideIfSeen)) return;

    if (c.href){
      const a = document.createElement("a");
      a.className = "ch link" + (c.style ? " " + c.style : "");
      a.textContent = c.t;
      a.href = c.href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      $ch.appendChild(a);
      return;
    }

    const btn = document.createElement("button");
    btn.className = "ch" + (c.style ? " " + c.style : "");
    btn.textContent = c.t;
    btn.onclick = function(){ go(c.go, c.t); };
    $ch.appendChild(btn);
  });
  /* 最初の画面にいるあいだだけ、いちばん下に出します */
  if (resumeBtn && stack.length === 1 && stack[0] === "S00") $ch.appendChild(resumeBtn);
}

/* ============================================================
   移動
   ============================================================ */
function go(id, echo){
  if (id === "__ALL__"){ openDoc("all", true); return; }
  if (id === "__FAQ__"){ openDoc("faq", true); return; }
  if (id === "__TOP__"){ restart(); return; }
  if (id === "__RETURN__"){ closeTutorial(); return; }
  history.pushState({ g:id, e:echo || "" }, "");
  renderBlock(id, { echo:echo });
}

/* ガイドを閉じて、キニナルメーカーに戻る
   ・アプリから別タブで開かれた場合 → このタブを閉じる（元のログイン画面に戻る）
   ・直接ひらいた等で閉じられない場合 → アプリのトップへ移動する */
function closeTutorial(){
  window.close();
  setTimeout(function(){ location.href = "/"; }, 300);
}

/* いまの stack のうしろを、目的のところまで取り除く */
function unwindTo(index){
  while (stack.length > index + 1){
    stack.pop();
    if ($thread.lastElementChild) $thread.lastElementChild.remove();
  }
  const id = stack[stack.length - 1];
  const sec = $thread.lastElementChild;
  updateProgress(id);
  saveProgress();
  $back.disabled = stack.length <= 1;
  paintChoices(sec ? sec._choices : null);
  toBottom(false);
}

/* ============================================================
   別画面（ぜんぶ読む・よくある質問）
   ============================================================ */
function docAllHtml(){
  let html = "";
  CHAPTERS.forEach(function(chap){
    html += "<h2>" + chap.name + "</h2><div data-ids='" + chap.ids.join(",") + "'></div>";
  });
  return html;
}

function openDoc(kind, push){
  clearTimers(); pending = null;
  docOpen = kind;
  $thread.hidden = true;
  $doc.hidden = false;
  $doc.className = "doc";
  $doc.innerHTML = "";
  $ch.innerHTML = "";
  window.scrollTo(0, 0);
  if (push) history.pushState({ d:kind }, "");

  if (kind === "faq"){
    let html = "<h2>よくある質問</h2>";
    FAQ.forEach(function(qa){
      html += '<div class="qa"><b>Q. ' + qa[0] + "</b>" + qa[1] + "</div>";
    });
    $doc.innerHTML = html;
  } else {
    $doc.innerHTML = docAllHtml();
    $doc.querySelectorAll("div[data-ids]").forEach(function(slot){
      slot.dataset.ids.split(",").forEach(function(id){
        const block = SCRIPT[id];
        if (!block) return;
        let first = true;
        block.forEach(function(item){
          if (item.c) return;
          const n = item.img ? makeFigure(item.img, item.cap, item.ar) : makeBubble(item, first);
          n.style.animation = "none"; n.style.opacity = "1";
          slot.appendChild(n);
          first = false;
        });
      });
    });
  }

  $chap.textContent = (kind === "faq") ? "よくある質問" : "ぜんぶまとめて読む";
  $step.textContent = "";
  $bar.style.width = "100%";
  $back.disabled = false;

  const close = document.createElement("button");
  close.className = "ch";
  close.textContent = stack.length ? "会話にもどる" : "会話ですすむ形ではじめる";
  close.onclick = function(){ history.back(); };
  $ch.appendChild(close);
}

function closeDoc(){
  docOpen = null;
  $doc.hidden = true;
  $doc.innerHTML = "";
  $thread.hidden = false;
  if (!stack.length){ renderBlock("S00", { instant:true }); return; }
  const id = stack[stack.length - 1];
  updateProgress(id);
  $back.disabled = stack.length <= 1;
  paintChoices($thread.lastElementChild ? $thread.lastElementChild._choices : null);
  toBottom(false);
}

/* ============================================================
   ブラウザの「戻る」に対応する
   ============================================================ */
function applyState(st){
  if (!st) st = { g: stack[0] || "S00" };

  if (st.d){
    if (docOpen !== st.d) openDoc(st.d, false);
    return;
  }
  if (docOpen){ closeDoc(); }

  const i = stack.lastIndexOf(st.g);
  if (i >= 0){ unwindTo(i); }
  else { renderBlock(st.g, { echo:st.e, instant:true }); }
}

window.addEventListener("popstate", function(e){ applyState(e.state); });

$back.onclick = function(){ history.back(); };

/* ============================================================
   下のボタン
   ============================================================ */
document.getElementById("tgfaq").onclick = function(){
  if (docOpen === "faq") { history.back(); return; }
  openDoc("faq", true);
};
document.getElementById("tgnum").onclick = function(){
  document.body.classList.toggle("shownum");
  this.textContent = document.body.classList.contains("shownum") ? "画像番号を隠す" : "画像番号を表示";
};
document.getElementById("tgtop").onclick = restart;
document.getElementById("close").onclick = closeTutorial;

function restart(){
  clearTimers(); pending = null;
  docOpen = null;
  $doc.hidden = true; $doc.innerHTML = "";
  $thread.hidden = false; $thread.innerHTML = "";
  stack.length = 0;
  hintLeft = 3;
  resumeBtn = null;   /* 読みなおすと決めた人に、古い続きは出しません */
  history.replaceState({ g:"S00" }, "");
  renderBlock("S00", {});
  window.scrollTo(0, 0);
}

/* ============================================================
   開始（途中まで見ていたら、その続きから）
   ============================================================ */
(function start(){
  let saved = null;
  try{ saved = JSON.parse(store.get("kn_guide_stack") || "null"); }catch(e){}

  const valid = Array.isArray(saved) ? saved.filter(function(id){ return SCRIPT[id]; }) : [];

  /* 「前回のつづきから読む」。
     あとから生やすと押しそこねるので、選択ボタンと同時に出します。 */
  if (valid.length > 1){
    resumeBtn = document.createElement("button");
    resumeBtn.className = "ch sub";
    resumeBtn.textContent = "前回のつづきから読む";
    resumeBtn.onclick = function(){
      clearTimers(); pending = null;
      resumeBtn = null;
      $thread.innerHTML = "";
      stack.length = 0;
      history.replaceState({ g:valid[0] }, "");
      valid.forEach(function(id, i){
        if (i > 0) history.pushState({ g:id }, "");
        renderBlock(id, { instant:true });
      });
      toBottom(false);
    };
  }

  history.replaceState({ g:"S00" }, "");
  renderBlock("S00", {});
})();

</script>
